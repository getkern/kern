[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kern-sandbox"
version = "0.1.39"
description = "kern is a fast, rootless sandbox and virtual resource runtime for any workload, including untrusted and AI-generated code; kern-sandbox is its Python binding. Run untrusted or agent-generated code (Python/JS/Bash) in a real, kernel-enforced box in single-digit milliseconds, with no cloud, no account and no VM."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "getkern" }]
keywords = ["sandbox", "code-interpreter", "isolation", "namespaces", "seccomp", "agent", "llm", "code-execution", "e2b", "jupyter", "edge", "ci"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]

# The binding itself has no dependencies and is meant to keep it that way: this extra exists so that
# `kern_sandbox.langchain` can be installed on purpose, and never as a side effect of `pip install
# kern-sandbox`. Floor measured, not assumed: the tool was built and run against langchain-core 0.3.0,
# 0.3.29, 1.0.0 and 1.6.0.
[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]
# The shell EXECUTION POLICY needs the umbrella package, not just the core: langchain's shell
# middleware and its `BaseExecutionPolicy` live in `langchain.agents.middleware`. Floor measured, not
# assumed: 1.3.0 and 1.3.12 and 1.3.17 all build the policy, 1.2.0 has no such base class.
langchain-shell = ["langchain>=1.3"]

[project.scripts]
kern-mcp = "kern_sandbox.mcp:main"

[project.urls]
Homepage = "https://getkern.dev"
Repository = "https://github.com/getkern/kern"
Source = "https://github.com/getkern/kern/tree/main/bindings/python"

[tool.hatch.build.targets.wheel]
packages = ["kern_sandbox"]
