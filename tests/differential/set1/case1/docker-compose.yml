services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 2s
      retries: 30
  torch:
    image: kern-torch:test
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NVIDIA_VISIBLE_DEVICES: "0"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command:
      - python3
      - -c
      - |
        import torch, socket, os, sys
        assert torch.cuda.is_available(), "no cuda"
        x = torch.randn(1024, 1024, device="cuda")
        y = (x @ x).sum().item()
        s = socket.create_connection(("redis", 6379), 5)
        s.sendall(b"PING\r\n")
        r = s.recv(16)
        s.close()
        assert r.startswith(b"+PONG"), r
        print("GPU_OK", torch.cuda.get_device_name(0), "MATMUL", y)
        sys.stdout.flush()
