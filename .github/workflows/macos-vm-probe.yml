name: macOS VM probe (manual)

# A ONE-QUESTION experiment, run by hand, kept because the answer decides real work.
#
# The claim it tests: a hosted macOS runner cannot hold a Linux VM, because GitHub's Mac runners are
# themselves virtualized and nested virtualization is not exposed, so colima has nothing to boot a
# guest on. That claim has been repeated as a reason to buy hardware and to ask a human to run the
# end-to-end check by hand. It has never been executed. If it is WRONG, the whole "kern inside a
# Linux VM on a Mac" path becomes testable on every push and the human is not needed.
#
# `continue-on-error` on the start step is the point: a failure here is a RESULT, not a broken build.
on:
  workflow_dispatch:

jobs:
  probe:
    name: can a hosted Mac hold a Linux VM?
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: what this runner actually is
        run: |
          sw_vers
          uname -m
          sysctl -n hw.memsize
          sysctl -n machdep.cpu.brand_string || true
      - name: how long does macOS take to start a process
        # The one macOS measurement that needs no VM, and in the shim budget it is the heaviest and
        # least certain term: on a Mac every `kern` invocation pays dyld plus signature validation
        # before any of kern's own work begins. Same command a human ran on a real MacBook, so the
        # two numbers are comparable. READ IT AS AN UPPER BOUND: this runner is itself virtualized,
        # and /usr/bin/true is far smaller than a real client binary, so the floor is below this and
        # a shipped binary would sit above it.
        run: |
          for round in 1 2 3; do
            start=$(python3 -c 'import time; print(time.time_ns())')
            for _ in $(seq 100); do /usr/bin/true; done
            end=$(python3 -c 'import time; print(time.time_ns())')
            echo "round $round: $(( (end - start) / 100 / 1000 )) us per process"
          done

      - name: install colima
        run: brew install colima
      - name: try to start a Linux VM
        id: start
        continue-on-error: true
        # `--runtime containerd` rather than the default: colima's default runtime is docker and it
        # refuses to start at all when the docker CLI is absent, which a hosted runner's is. The first
        # run of this probe hit exactly that and reported "cannot hold a VM", a dependency check
        # mistaken for a hypervisor verdict. The VM is all this asks about, so the runtime inside it
        # is beside the point.
        run: colima start --runtime containerd --cpu 2 --memory 4
      - name: what the guest's own boot said
        if: steps.start.outcome != 'success'
        # The run above dies at `Starting VZ` with a status line and a hint, and the hint is where
        # the actual reason lives. Without these two files the conclusion would again be a guess
        # about nested virtualization dressed as a finding.
        run: |
          for f in ~/.colima/_lima/colima/ha.stderr.log ~/.colima/_lima/colima/serial*.log; do
            [ -f "$f" ] || continue
            echo "===== $f"
            tail -60 "$f"
          done

      - name: if it started, is it Linux, and does kern run in it
        if: steps.start.outcome == 'success'
        run: |
          # `$HOME` is single-quoted on purpose: it must expand in the GUEST shell, where the home
          # is the VM user's, not in this runner's shell. shellcheck cannot see across that boundary.
          # shellcheck disable=SC2016
          colima ssh -- uname -s -m
          colima ssh -- sh -c 'curl -fsSL https://raw.githubusercontent.com/getkern/kern/main/install.sh | sh'
          # shellcheck disable=SC2016
          colima ssh -- sh -c '$HOME/.local/bin/kern --version'
          # shellcheck disable=SC2016
          colima ssh -- sh -c '$HOME/.local/bin/kern box dev --image alpine -- cat /etc/os-release'
      - name: what a Mac user gets from the REGISTRIES, not from this tree
        # ci.yml checks the tree; this checks the artefact a stranger actually installs, which is a
        # different thing and the one that can be stale: a readme and an error message only reach
        # PyPI and npm when a release carries them. Kept out of the push CI on purpose, since it
        # depends on two networks nobody here controls.
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install kern-sandbox
          python3 - <<'PY'
          import kern_sandbox as k

          print("PyPI version:", k.__version__)
          try:
              found = k._find_kern()
          except k.SandboxError as e:
              msg = str(e)
          else:
              raise SystemExit(f"a kern turned up on a macOS runner: {found}")
          print(msg)
          for want in ("macOS", "Linux VM", "KERN_BIN"):
              assert want in msg, f"the PUBLISHED package lost {want!r}: it needs a new release"
          PY
          npm install kern-sandbox --no-fund --no-audit
          node -e '
            const m = require("kern-sandbox");
            console.log("npm version:", m.version);
            let msg = null;
            try { new m.Sandbox(); } catch (e) { msg = e.message; }
            if (msg === null) throw new Error("a kern turned up on a macOS runner");
            console.log(msg);
            for (const want of ["macOS", "Linux VM", "KERN_BIN"])
              if (!msg.includes(want)) throw new Error("the PUBLISHED package lost " + want);
          '

      - name: the answer
        run: |
          echo "colima start: ${{ steps.start.outcome }}"
          if [ "${{ steps.start.outcome }}" = "success" ]; then
            echo "A hosted Mac CAN hold a Linux VM. The end-to-end Mac check can be automated."
          else
            echo "colima did not start. READ THE LOG BEFORE CONCLUDING ANYTHING: a missing"
            echo "dependency, a download, or a timeout are not a hypervisor verdict. Only a"
            echo "failure inside the VM's own boot is evidence about nested virtualization."
          fi
