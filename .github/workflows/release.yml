name: Release
# Build static (musl) binaries for linux-x86_64 and linux-aarch64, the Windows shim and the WSL
# rootfs on a version tag, and put them on a DRAFT GitHub Release in one step. The owner signs the
# draft and publishes it (`scripts/sign-release.sh`). `install.sh` and `install.ps1` download from it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag whose draft release to (re)build (e.g. v0.52.0); a published release is refused"
        required: true

# READ BY DEFAULT. Only `publish` writes, and it is the job that puts the draft together; every other
# job hands its files on as artifacts. A build step that is compromised gets a token that can read the
# repository and nothing else.
permissions:
  contents: read

jobs:
  # THE EVIDENCE GATE RUNS BEFORE ANYTHING IS BUILT, AND IT REFUSES THE TAG.
  #
  # `scripts/check-pentest-freshness.py` already existed and already went red: on 2026-09-08 it read
  # "v0.9.3 is not contained in 3195fd4b0255", meaning the five suites behind SECURITY.md had never
  # been run on the code that shipped as v0.9.3. It had been red since that tag and nobody looked,
  # because it ran only on a schedule. The check worked; the READING of it did not, which is a
  # failure one layer above the one it was built for.
  #
  # A check whose failure stops nothing is a check that gets ignored, so this is the same move as
  # `record_pod_boot` going fail-fast: the moment that must not proceed on stale evidence is the tag,
  # so the refusal belongs at the tag. It reads a stamp file and needs no privileges, which is why it
  # can gate here even though the suites it vouches for cannot run on a GitHub runner at all.
  #
  # `fetch-depth: 0` is load-bearing: the check asks whether the stamped commit CONTAINS the tag, and
  # a shallow clone has neither the history to answer nor a way to say so.
  evidence:
    name: pentest evidence is fresh for this tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: pentest freshness
        run: python3 scripts/check-pentest-freshness.py

  build:
    needs: evidence
    name: build ${{ matrix.target }}
    # A TAG PUSH BUILDS EVERYTHING, AND A DISPATCH NOW DOES TOO. This used to read
    # `if: github.event_name == 'push'`, on the reasoning that a manual dispatch only backfills the
    # Windows assets because "the Linux binaries are already attached from the tag's original run".
    # v0.9.31 falsified that: its original run's `evidence` gate went red, `build` was SKIPPED behind
    # it, and the release published with the Windows assets and NO Linux binaries. `install.sh`
    # downloads from there, so the release was broken for every Linux user, and the one path that
    # could repair it declined to.
    #
    # `needs: evidence` is kept, and the condition below is what makes it survive a dispatch: on that
    # event `evidence` is SKIPPED, and a job whose `needs` was skipped is skipped too unless it says
    # otherwise. Skipped is accepted, FAILED is not - a dispatch may repair a release, and may not
    # walk past a gate that actually fired.
    if: >-
      !cancelled()
      && (needs.evidence.result == 'success' || needs.evidence.result == 'skipped')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      # THE TAG, NOT THE DEFAULT BRANCH. On a dispatch `github.ref` is `main`, so a bare checkout
      # would build whatever `main` happens to be and stamp the tag's version onto it: an asset that
      # claims to be v0.9.31 and is not. `fetch-depth: 0` because the version comes from the tag.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
      # A PINNED nightly, used ONLY to shrink the shipped artifact. The source is 100% stable Rust
      # (no `#![feature]`), so `cargo build --release` on stable still produces a working binary - this
      # only makes the released one ~22% smaller. Pinned for a reproducible build; bump deliberately and
      # re-validate (a throwaway tag push, see below) when you move it.
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: nightly-2026-08-09
          targets: ${{ matrix.target }}
          components: rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install musl tooling
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Stamp the release version from the tag
        # The source is de-versioned (Cargo.toml pins 0.0.0, so no stale number lives in git); the
        # SHIPPED binary should still report the tag - `kern --version` on a release build says the
        # tag's version, not 0.0.0. Runs ONLY in CI, on the tag; the committed source is never touched.
        # `github.ref_name` is `main` on a dispatch, and stamping `version = "main"` is the shape of
        # this bug, not a typo: the same resolution the windows job already uses is used here.
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          sed -i "s/^version = \"0.0.0\"/version = \"${TAG#v}\"/" Cargo.toml
      - name: Build (static, size-extreme)
        # `-Zbuild-std` rebuilds std/core under the release profile's opt-level="z"; `panic=immediate-abort`
        # drops std's panic-formatting machinery (the code is panic-free in production, and a panic that
        # cannot happen now fail-fast aborts instead of unwinding). ~22% smaller, latency-neutral. A plain
        # stable `cargo build --release` remains the supported fallback and yields the same behavior.
        #
        # `optimize_for_size` builds that std with core's size-first code paths (the smaller sort, the
        # compact formatting and search implementations). MEASURED on this tree: x86_64 1600312 ->
        # 1518392 B, aarch64 1299000 -> 1226296 B, a further ~5%. Latency-neutral, verified the way the
        # panic flag was: 200-round sequential `box --image` alternating the two binaries, 3329/3373 us
        # against 3379/3349 - inside the run-to-run noise. Behaviour verified on the built artifact, not
        # assumed: the 48-check end-to-end battery gives the same result as the standard binary, and a
        # box on all three ARM boards still comes up capped at the exact `--memory` value.
        env:
          RUSTFLAGS: "-Zunstable-options -Cpanic=immediate-abort"
        run: >
          cargo +nightly-2026-08-09 build --release --target ${{ matrix.target }} --bin kern
          -Z build-std=std,panic_abort
          -Z build-std-features=optimize_for_size
      - name: Package
        run: |
          set -eu
          name="kern-${{ matrix.target }}"
          install -Dm755 "target/${{ matrix.target }}/release/kern" "dist/kern"
          strip "dist/kern" || true
          # ONE FILE. A release tarball is the binary and nothing else, and `cargo install` copies
          # one file too, so NOTHING in `packaging/` reaches a user this way. Anything added there
          # needs its own delivery path: `packaging/apparmor/kern` is compiled in with
          # `include_str!` and emitted by `kern doctor --apparmor-profile` for that reason. See
          # packaging/README.md before assuming a new file ships.
          tar -C dist -czf "${name}.tar.gz" kern
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
      # WHAT THIS BINARY LINKS, read from this build: the resolver's graph, checked against the
      # units cargo compiled for the target (a crate in one and not the other stops the release),
      # the toolchain, the musl it links and the binary's sha256. The `sbom` job assembles these.
      - name: What the binary links (for the SBOM)
        run: >
          python3 scripts/sbom.py collect --package getkern --target ${{ matrix.target }}
          --toolchain nightly-2026-08-09 --build-std --target-dir target --binary dist/kern
          --out sbom-input-${{ matrix.target }}.json
      - name: Hand the SBOM input to the sbom job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-input-${{ matrix.target }}
          path: sbom-input-${{ matrix.target }}.json
          if-no-files-found: error
      # TO THE PUBLISH JOB, NOT TO THE RELEASE: every asset reaches the release in one step, as a
      # DRAFT, so nothing is public before the owner has signed it (`scripts/sign-release.sh`).
      - name: Hand the tarball to the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: |
            kern-${{ matrix.target }}.tar.gz
            kern-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  sbom:
    name: SBOM (SPDX)
    # WHAT EACH PUBLISHED FILE CONTAINS, built from what the builds compiled (`scripts/sbom.py`).
    # It used to be Syft over the checkout: MEASURED on v0.56.0, 68 entries listing the workflow's
    # actions and crates the binary never links, nothing for the WSL rootfs's Alpine packages, the
    # rebuilt standard library or the static musl, 3 licenses, and no signature. Now every asset is
    # an entry with its sha256 and what it contains, the file is deterministic for a tag, and it
    # carries a .sha256 so `sign-release.sh` signs it with the rest.
    #
    # After `build` and `windows` because it needs their files: the assets' bytes and what each
    # build reported. `evidence` gates it through them.
    needs: [build, windows]
    if: >-
      !cancelled()
      && needs.build.result == 'success'
      && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: sbom-input-*
          path: sbom-inputs
          merge-multiple: true
      - name: Assemble kern.spdx.json
        # The tag commit's time is the document's, so the same tag gives the same bytes.
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -eu
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" python3 scripts/sbom.py assemble \
            --tag "$TAG" --assets assets --inputs sbom-inputs --out kern.spdx.json
          sha256sum -c kern.spdx.json.sha256
      - name: Hand the SBOM to the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kern.spdx.json
          path: |
            kern.spdx.json
            kern.spdx.json.sha256
          if-no-files-found: error

  windows:
    # GATED THROUGH `build`, whose x86_64 tarball it needs: the kern inside the WSL rootfs IS that
    # tarball's binary, byte for byte. It used to compile its own (stable toolchain, not stripped):
    # MEASURED on v0.51.3, the rootfs's /usr/local/bin/kern was 4294936 B against the signed
    # tarball's 3522248 B, both saying 0.51.3, so a WSL install ran a binary no signature covered and
    # `kern self-update` would not replace it (same version).
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    name: windows shim + WSL rootfs
    runs-on: ubuntu-latest
    steps:
      # THE TAG, for the reason the build job states: on a dispatch a bare checkout builds `main` and
      # then stamps the tag's version onto it. The assets on v0.9.31 were produced that way before
      # this line existed.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install cross tooling (mingw)
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: The release tag to attach to
        id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - name: Stamp the release version from the tag
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          sed -i "s/^version = \"0.0.0\"/version = \"${TAG#v}\"/" Cargo.toml
      - name: Build the kern.exe shim (mingw cross)
        # --target-dir target: the shim is its OWN (workspace-excluded) crate, so by default it would
        # build into windows/kern-win/target; pin it to the repo-root target dir the Package step reads.
        run: cargo build --release --target x86_64-pc-windows-gnu --manifest-path windows/kern-win/Cargo.toml --target-dir target
      - name: The released x86_64 tarball (its kern goes into the WSL rootfs)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-x86_64-unknown-linux-musl
          path: linux
      - name: Unpack the released kern
        run: |
          set -eu
          cd linux
          sha256sum -c kern-x86_64-unknown-linux-musl.tar.gz.sha256
          tar -xzf kern-x86_64-unknown-linux-musl.tar.gz kern
      - name: Build the pre-baked WSL rootfs (Alpine + kern, in a user namespace)
        run: |
          set -eu
          # Ubuntu 24.04 runners default to AppArmor-restricted unprivileged userns; the rootfs build
          # bootstraps Alpine via `unshare -r` (no root). Relax the restriction for this runner only.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          KERN_BIN="$PWD/linux/kern" \
          OUT="$PWD/kern-wsl-rootfs.tar.gz" \
          sh windows/kern-win/build-wsl-rootfs.sh
      - name: The rootfs carries the released kern, byte for byte
        run: |
          set -eu
          mkdir check
          tar -xzf kern-wsl-rootfs.tar.gz -C check ./usr/local/bin/kern 2>/dev/null \
            || tar -xzf kern-wsl-rootfs.tar.gz -C check usr/local/bin/kern
          want="$(sha256sum linux/kern | cut -d' ' -f1)"
          got="$(sha256sum check/usr/local/bin/kern | cut -d' ' -f1)"
          echo "released kern  $want"
          echo "rootfs kern    $got"
          [ "$want" = "$got" ] || { echo "::error::the WSL rootfs carries a kern that is not the released one"; exit 1; }
      # What kern.exe links (read from this build, as for the Linux binaries) and what the rootfs
      # carries (its apk database), for the `sbom` job.
      - name: What kern.exe links and the rootfs carries (for the SBOM)
        run: |
          set -eu
          python3 scripts/sbom.py collect --package kern-win \
            --manifest-path windows/kern-win/Cargo.toml --target x86_64-pc-windows-gnu \
            --target-dir target --binary target/x86_64-pc-windows-gnu/release/kern.exe \
            --out sbom-input-x86_64-pc-windows-gnu.json
          python3 scripts/sbom.py rootfs --tar kern-wsl-rootfs.tar.gz --out sbom-input-wsl-rootfs.json
      - name: Hand the SBOM inputs to the sbom job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-input-windows
          path: |
            sbom-input-x86_64-pc-windows-gnu.json
            sbom-input-wsl-rootfs.json
          if-no-files-found: error
      - name: Package + checksums (exact names install.ps1 expects)
        run: |
          set -eu
          cp target/x86_64-pc-windows-gnu/release/kern.exe kern-windows-x86_64.exe
          sha256sum kern-windows-x86_64.exe > kern-windows-x86_64.exe.sha256
          sha256sum kern-wsl-rootfs.tar.gz  > kern-wsl-rootfs.tar.gz.sha256
      - name: Hand the Windows assets to the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows
          path: |
            kern-windows-x86_64.exe
            kern-windows-x86_64.exe.sha256
            kern-wsl-rootfs.tar.gz
            kern-wsl-rootfs.tar.gz.sha256
          if-no-files-found: error

  publish:
    # ONE STEP PUTS EVERY ASSET ON THE RELEASE, AND A NEW RELEASE IS A DRAFT. The owner signs the
    # draft (`sh scripts/sign-release.sh vX.Y.Z`, the key never leaves their machine) and the script
    # publishes it, so a release is never public without its signatures. With GitHub's immutable
    # releases on, nothing can be added or swapped after that. A draft that already exists (a
    # dispatch rebuilding one) gets the files uploaded over; a published release is refused.
    name: publish (draft)
    needs: [build, windows, sbom]
    if: >-
      !cancelled()
      && needs.build.result == 'success'
      && needs.windows.result == 'success'
      && needs.sbom.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kern.spdx.json
          path: assets
      - name: Create the draft, or update the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -eu
          ls -l assets
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A DRAFT may be rebuilt; a PUBLISHED release is not touched: new files would not match
            # the signatures already on it.
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != true ]; then
              echo "::error::$TAG is already published: its signed assets are not replaced"
              exit 1
            fi
            gh release upload "$TAG" assets/* --clobber
          else
            gh release create "$TAG" assets/* --draft --verify-tag --title "$TAG" --notes ""
          fi
