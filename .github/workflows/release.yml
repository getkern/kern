name: Release
# Build static (musl) binaries for linux-x86_64 and linux-aarch64 on a version tag and attach
# them - plus SHA256SUMS - to the GitHub Release. `install.sh` downloads from here.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build + attach assets for (e.g. v0.6.3)"
        required: true

permissions:
  contents: write # create/upload release assets

jobs:
  # THE EVIDENCE GATE RUNS BEFORE ANYTHING IS BUILT, AND IT REFUSES THE TAG.
  #
  # `scripts/check-pentest-freshness.py` already existed and already went red: on 2026-09-08 it read
  # "v0.9.3 is not contained in 3195fd4b0255", meaning the five suites behind SECURITY.md had never
  # been run on the code that shipped as v0.9.3. It had been red since that tag and nobody looked,
  # because it ran only on a schedule. The check worked; the READING of it did not, which is a
  # failure one layer above the one it was built for.
  #
  # A check whose failure stops nothing is a check that gets ignored, so this is the same move as
  # `record_pod_boot` going fail-fast: the moment that must not proceed on stale evidence is the tag,
  # so the refusal belongs at the tag. It reads a stamp file and needs no privileges, which is why it
  # can gate here even though the suites it vouches for cannot run on a GitHub runner at all.
  #
  # `fetch-depth: 0` is load-bearing: the check asks whether the stamped commit CONTAINS the tag, and
  # a shallow clone has neither the history to answer nor a way to say so.
  evidence:
    name: pentest evidence is fresh for this tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: pentest freshness
        run: python3 scripts/check-pentest-freshness.py

  build:
    needs: evidence
    name: build ${{ matrix.target }}
    # A TAG PUSH BUILDS EVERYTHING, AND A DISPATCH NOW DOES TOO. This used to read
    # `if: github.event_name == 'push'`, on the reasoning that a manual dispatch only backfills the
    # Windows assets because "the Linux binaries are already attached from the tag's original run".
    # v0.9.31 falsified that: its original run's `evidence` gate went red, `build` was SKIPPED behind
    # it, and the release published with the Windows assets and NO Linux binaries. `install.sh`
    # downloads from there, so the release was broken for every Linux user, and the one path that
    # could repair it declined to.
    #
    # `needs: evidence` is kept, and the condition below is what makes it survive a dispatch: on that
    # event `evidence` is SKIPPED, and a job whose `needs` was skipped is skipped too unless it says
    # otherwise. Skipped is accepted, FAILED is not - a dispatch may repair a release, and may not
    # walk past a gate that actually fired.
    if: >-
      !cancelled()
      && (needs.evidence.result == 'success' || needs.evidence.result == 'skipped')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      # THE TAG, NOT THE DEFAULT BRANCH. On a dispatch `github.ref` is `main`, so a bare checkout
      # would build whatever `main` happens to be and stamp the tag's version onto it: an asset that
      # claims to be v0.9.31 and is not. `fetch-depth: 0` because the version comes from the tag.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
      # A PINNED nightly, used ONLY to shrink the shipped artifact. The source is 100% stable Rust
      # (no `#![feature]`), so `cargo build --release` on stable still produces a working binary - this
      # only makes the released one ~22% smaller. Pinned for a reproducible build; bump deliberately and
      # re-validate (a throwaway tag push, see below) when you move it.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-09
          targets: ${{ matrix.target }}
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: Install musl tooling
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Stamp the release version from the tag
        # The source is de-versioned (Cargo.toml pins 0.0.0, so no stale number lives in git); the
        # SHIPPED binary should still report the tag - `kern --version` on a release build says the
        # tag's version, not 0.0.0. Runs ONLY in CI, on the tag; the committed source is never touched.
        # `github.ref_name` is `main` on a dispatch, and stamping `version = "main"` is the shape of
        # this bug, not a typo: the same resolution the windows job already uses is used here.
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          sed -i "s/^version = \"0.0.0\"/version = \"${TAG#v}\"/" Cargo.toml
      - name: Build (static, size-extreme)
        # `-Zbuild-std` rebuilds std/core under the release profile's opt-level="z"; `panic=immediate-abort`
        # drops std's panic-formatting machinery (the code is panic-free in production, and a panic that
        # cannot happen now fail-fast aborts instead of unwinding). ~22% smaller, latency-neutral. A plain
        # stable `cargo build --release` remains the supported fallback and yields the same behavior.
        #
        # `optimize_for_size` builds that std with core's size-first code paths (the smaller sort, the
        # compact formatting and search implementations). MEASURED on this tree: x86_64 1600312 ->
        # 1518392 B, aarch64 1299000 -> 1226296 B, a further ~5%. Latency-neutral, verified the way the
        # panic flag was: 200-round sequential `box --image` alternating the two binaries, 3329/3373 us
        # against 3379/3349 - inside the run-to-run noise. Behaviour verified on the built artifact, not
        # assumed: the 48-check end-to-end battery gives the same result as the standard binary, and a
        # box on all three ARM boards still comes up capped at the exact `--memory` value.
        env:
          RUSTFLAGS: "-Zunstable-options -Cpanic=immediate-abort"
        run: >
          cargo +nightly-2026-08-09 build --release --target ${{ matrix.target }} --bin kern
          -Z build-std=std,panic_abort
          -Z build-std-features=optimize_for_size
      - name: Package
        run: |
          set -eu
          name="kern-${{ matrix.target }}"
          install -Dm755 "target/${{ matrix.target }}/release/kern" "dist/kern"
          strip "dist/kern" || true
          # ONE FILE. A release tarball is the binary and nothing else, and `cargo install` copies
          # one file too, so NOTHING in `packaging/` reaches a user this way. Anything added there
          # needs its own delivery path: `packaging/apparmor/kern` is compiled in with
          # `include_str!` and emitted by `kern doctor --apparmor-profile` for that reason. See
          # packaging/README.md before assuming a new file ships.
          tar -C dist -czf "${name}.tar.gz" kern
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          # Without this a dispatch attaches to `github.ref`, which is the branch and not the release.
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            kern-${{ matrix.target }}.tar.gz
            kern-${{ matrix.target }}.tar.gz.sha256
          fail_on_unmatched_files: true

  sbom:
    name: SBOM (SPDX)
    # Gated too: an SBOM attached to a release whose evidence is stale asserts a provenance the
    # suites have not vouched for. `windows` is deliberately NOT gated - it also serves the manual
    # backfill onto an EXISTING release, where the tag was already gated when it was cut, and
    # `needs:` on a push-only job would make that path unrunnable.
    needs: evidence
    # Same reasoning as `build`: a dispatch that repairs a release must be able to attach the SBOM
    # the original run never produced.
    if: >-
      !cancelled()
      && (needs.evidence.result == 'success' || needs.evidence.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write # anchore/sbom-action attaches the SBOM to the tag's release
    # The dependency tree is identical across targets (one Cargo.lock), so the SBOM is generated
    # once for the whole project rather than per matrix target. On a tag push the action attaches
    # kern.spdx.json to the release itself (upload-release-assets defaults to true).
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - name: Generate SPDX SBOM (Syft) and attach to the release
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: kern.spdx.json

  windows:
    # NOT GATED ON `evidence`, AND THIS IS THE EXEMPTION THAT DECAYS IF NOBODY WRITES IT DOWN.
    #
    # This job serves two paths: a tag push, and the manual backfill of Windows assets onto an
    # ALREADY-EXISTING release. The exemption is sound only because a backfill targets a tag that was
    # gated when it was cut, so the evidence question was already answered for it. `needs: evidence`
    # would make the backfill unrunnable, since `evidence` is push-only.
    #
    # WHAT WOULD MAKE THE EXEMPTION FALSE: a backfill targeting a tag cut BEFORE the gate existed, or
    # any new job copied from this one because it is the simpler template. A job that builds release
    # artefacts and is not gated needs its own reason, not this one.
    name: windows shim + WSL rootfs
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the Windows assets to the release
    steps:
      # THE TAG, for the reason the build job states: on a dispatch a bare checkout builds `main` and
      # then stamps the tag's version onto it. The assets on v0.9.31 were produced that way before
      # this line existed.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu, x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install cross tooling (mingw + musl)
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 musl-tools
      - name: The release tag to attach to
        id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - name: Stamp the release version from the tag
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          sed -i "s/^version = \"0.0.0\"/version = \"${TAG#v}\"/" Cargo.toml
      - name: Build the kern.exe shim (mingw cross)
        # --target-dir target: the shim is its OWN (workspace-excluded) crate, so by default it would
        # build into windows/kern-win/target; pin it to the repo-root target dir the Package step reads.
        run: cargo build --release --target x86_64-pc-windows-gnu --manifest-path windows/kern-win/Cargo.toml --target-dir target
      - name: Build the kern musl binary (baked into the WSL rootfs)
        run: cargo build --release --target x86_64-unknown-linux-musl --bin kern
      - name: Build the pre-baked WSL rootfs (Alpine + kern, in a user namespace)
        run: |
          set -eu
          # Ubuntu 24.04 runners default to AppArmor-restricted unprivileged userns; the rootfs build
          # bootstraps Alpine via `unshare -r` (no root). Relax the restriction for this runner only.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          KERN_BIN="$PWD/target/x86_64-unknown-linux-musl/release/kern" \
          OUT="$PWD/kern-wsl-rootfs.tar.gz" \
          sh windows/kern-win/build-wsl-rootfs.sh
      - name: Package + checksums (exact names install.ps1 expects)
        run: |
          set -eu
          cp target/x86_64-pc-windows-gnu/release/kern.exe kern-windows-x86_64.exe
          sha256sum kern-windows-x86_64.exe > kern-windows-x86_64.exe.sha256
          sha256sum kern-wsl-rootfs.tar.gz  > kern-wsl-rootfs.tar.gz.sha256
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            kern-windows-x86_64.exe
            kern-windows-x86_64.exe.sha256
            kern-wsl-rootfs.tar.gz
            kern-wsl-rootfs.tar.gz.sha256
          fail_on_unmatched_files: true
