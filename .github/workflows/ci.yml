name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: build + test (x86)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --all-features
      - name: test
        run: cargo test --all
        # HW/privilege-gated tests skip gracefully, so x86 CI stays green.
      - name: docs
        # The two prose gates. They existed before this step and ran only when someone remembered
        # them, which is the same as not running: the three figures that drifted over the launch
        # weekend (3.6 vs 3.4 ms, five vs nine ENOSYS syscalls, ~186 vs 154-160 MB) were all caught
        # by hand or, in one case, by an outside reviewer repeating our own wrong number back to us.
        # Pure stdlib Python, both under a second, both at zero on the corpus when this was added.
        run: |
          python3 scripts/no-ai-slop.py
          python3 scripts/stale-numbers.py
          python3 scripts/test-count.py
          # Every child under the runtime registry root must be CLASSIFIED (authoritative dir / box-data
          # dir / sibling tree / cosmetic file) at COMPILE time, not just when a constructor is exercised
          # at runtime: `runstats` builds `<runtime>/kern/runstats` WITHOUT the runtime chokepoint, the
          # exact bypass that let `waitexit/` ship mountable. This fails the build on a new registry child
          # that is not classified, or a chokepoint constructor that stops classifying.
          python3 scripts/registry-classified.py
          # Diff-gate the seccomp allowlist: the allow set is DERIVED from the pinned moby profile, a
          # source we do not control, so a profile bump could pull a new syscall into it silently. This
          # fails if seccomp/allow-names.txt drifts from `moby_allow ∖ kern_denied`, naming the syscall
          # that would enter. Name level needs no compiler; the x86_64 number level runs when gcc is
          # present (aarch64 is skipped here for lack of the cross-toolchain).
          python3 scripts/gen-seccomp-allowlist.py --check
      - name: gpu claim suite
        # The ONE pentest suite that can run here, and it runs for a reason rather than for a green
        # tick. The other four start boxes and the runner's AppArmor denies the userns `setgroups`
        # they need, so they live behind `pentest/run-all.sh` and a freshness stamp. This one needs
        # no box.
        #
        # It covers MORE here than expected. The runner has one virtual DRM card in `/sys/class/drm`
        # and no `/dev/dri` node this user can open, so section A runs in full against a real card:
        # 10 PASS on the first CI run, including A8, which asserts against strace that the GPU scan
        # opens nothing under `/sys/class/drm` or `/proc/driver` for writing. That property was read
        # on one x86 desktop before this step existed; now a second machine of a different shape
        # checks it on every push. A3, the positive control that keeps the whole claim gate from
        # going quietly vacuous, runs here too.
        #
        # Battery B skips itself for want of an openable device node, which is a host that cannot
        # answer rather than a host that declined to, and the suite exits 0. It exits 3 only when
        # entry points exist and none of them answers, which is the case where a green would be a
        # lie. That distinction cost this step a red run before it was drawn correctly.
        run: sh pentest/pentest-gpu-claims.sh ./target/debug/kern

  workflow-lint:
    name: workflow syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The workflows are the one thing here with no local check at all: `yaml.safe_load` parses
      # `runs-on: ubunutu-latest` and a `${{ matrix.pyhton }}` typo without complaint, so a broken
      # job is found by pushing it, which is the worst moment. actionlint knows the runner labels
      # and type-checks the expression contexts; both were confirmed to fail on exactly those two
      # mistakes before this step was added.
      - uses: rhysd/actionlint@main
        with:
          args: -color

  bindings:
    name: python binding (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 is the floor `pyproject.toml` declares, and until this job existed the claim was static
          # analysis only. Installed WITHOUT the extra, because the binding's own promise is that it
          # needs nothing: the LangChain tests skip themselves and say so.
          - python: "3.9"
            extras: ""
          - python: "3.12"
            extras: "[langchain]"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest build
          python -m pip install "./bindings/python${{ matrix.extras }}"
      - name: test
        working-directory: bindings/python
        # `-rs` prints every skip WITH its reason. This runner cannot open a user namespace (AppArmor's
        # userns restriction, the same reason `pentest/` is not in CI), so the box-backed tests skip
        # here and the unit tests are what this job actually proves: rendering, output sanitising, the
        # output cap, argv and mount guards. Integration coverage stays a local claim, and the skip
        # list in the log is what says so out loud instead of a green tick implying otherwise.
        run: python -m pytest tests/ -q -rs
      - name: the binding depends on nothing
        # Checked on the ARTEFACT, not on the environment: a fresh venv always contains pip, so
        # "nothing else is installed" is not a statement anything can satisfy. Every Requires-Dist the
        # wheel declares must be behind an extra; one without a marker is a dependency by accident.
        run: |
          python -m build --wheel --outdir /tmp/whl ./bindings/python
          python - <<'PY'
          import glob, zipfile
          meta = ""
          with zipfile.ZipFile(glob.glob("/tmp/whl/*.whl")[0]) as z:
              meta = z.read([n for n in z.namelist() if n.endswith("METADATA")][0]).decode()
          reqs = [l for l in meta.splitlines() if l.startswith("Requires-Dist:")]
          unconditional = [r for r in reqs if "extra ==" not in r]
          assert not unconditional, f"the binding grew a hard dependency: {unconditional}"
          assert "Requires-Python: >=3.9" in meta, "the declared floor moved without anyone saying so"
          print(f"{len(reqs)} declared, all optional")
          PY

  test-arm:
    name: build + test (aarch64)
    # Native aarch64 hosted runner (free for public repos), not QEMU: the isolation code is
    # architecture-neutral and validated by hand on Pi / Jetson / UNO Q, so CI now proves it
    # compiles clippy-clean and its non-privileged tests pass on real aarch64 too, every push.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy --all-targets --all-features
      - name: test
        run: cargo test --all
        # The HW/privilege-gated tests skip gracefully here exactly as on x86 (the runner's
        # userns/AppArmor posture, not the arch), so aarch64 CI stays green.

  macos-guards:
    name: macOS guards (no VM)
    # A macOS runner cannot RUN kern, and that is not the point. kern needs a Linux kernel, and a
    # hosted macOS runner has no nested virtualization, so colima or Lima cannot start a VM to hold
    # one. What this runner can check is everything kern SAYS to a Mac user, which is the part that
    # had never been executed on Darwin at all: the installer's refusal, and each SDK's error when
    # no binary is on PATH. Those are the three doors a Mac user meets, and they were verified only
    # by faking `uname` on a Linux box until this job existed.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: the installer refuses Darwin, and hands over the route that works
        run: |
          set -u
          if out="$(sh install.sh 2>&1)"; then
            printf 'the installer exited 0 on macOS; it must refuse:\n%s\n' "$out" >&2
            exit 1
          fi
          printf '%s\n' "$out"
          printf '%s' "$out" | grep -q 'Linux-only (detected Darwin)' || {
            echo 'the refusal stopped naming Darwin' >&2; exit 1; }
          printf '%s' "$out" | grep -q 'colima' || {
            echo 'the refusal stopped saying where kern does run' >&2; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the Python SDK names the VM, not a download that does not exist
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./bindings/python
          python - <<'PY'
          import kern_sandbox as k

          try:
              found = k._find_kern()
          except k.SandboxError as e:
              msg = str(e)
          else:
              raise SystemExit(f"a kern turned up on a macOS runner: {found}")
          print(msg)
          for want in ("macOS", "Linux VM", "KERN_BIN"):
              assert want in msg, f"the macOS message lost {want!r}: {msg}"
          PY
      - name: the Node SDK says the same thing
        run: |
          node -e '
            const { Sandbox } = require("./bindings/node/index.js");
            let msg = null;
            try { new Sandbox(); } catch (e) { msg = e.message; }
            if (msg === null) throw new Error("a kern turned up on a macOS runner");
            console.log(msg);
            for (const want of ["macOS", "Linux VM", "KERN_BIN"])
              if (!msg.includes(want)) throw new Error("the macOS message lost " + want + ": " + msg);
          '

  audit:
    name: cargo-audit + cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Install recent prebuilt binaries so tool versions match local dev: the
      # pinned cargo-deny-action@v1 shipped an old cargo-deny that rejected newer
      # deny.toml keys / SPDX ids (e.g. Unicode-3.0).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      - name: cargo-deny
        run: cargo deny check
      - name: cargo-audit
        run: cargo audit
