name: CI
on:
  push:
    # ONE NAME HERE, AND IT IS LOAD-BEARING: a branch absent from this list is tested by nothing.
    # `dev` was added while it carried unreleased work and removed with it, because a dead branch
    # name says something untrue about what is being built. Add the branch back, in the same push
    # that creates it, whenever work leaves `main` again.
    branches: [main]
  pull_request:
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: build + test (x86)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --all-features
      - name: test
        run: cargo test --all
        # HW/privilege-gated tests skip gracefully, so x86 CI stays green.
      - name: docs
        # The two prose gates. They existed before this step and ran only when someone remembered
        # them, which is the same as not running: the three figures that drifted over the launch
        # weekend (3.6 vs 3.4 ms, five vs nine ENOSYS syscalls, ~186 vs 154-160 MB) were all caught
        # by hand or, in one case, by an outside reviewer repeating our own wrong number back to us.
        # Pure stdlib Python, both under a second, both at zero on the corpus when this was added.
        run: |
          python3 scripts/no-ai-slop.py
          python3 scripts/stale-numbers.py
          python3 scripts/test-count.py
          # Every child under the runtime registry root must be CLASSIFIED (authoritative dir / box-data
          # dir / sibling tree / cosmetic file) at COMPILE time, not just when a constructor is exercised
          # at runtime: `runstats` builds `<runtime>/kern/runstats` WITHOUT the runtime chokepoint, the
          # exact bypass that let `waitexit/` ship mountable. This fails the build on a new registry child
          # that is not classified, or a chokepoint constructor that stops classifying.
          python3 scripts/registry-classified.py
          # No message a user reads may carry a run of source indentation in the middle of a sentence.
          # A multi-line literal continued without `\` prints "so this profile would         not slow
          # the workload down". It happened twice: first in the CUDA shim, then in the budget warnings
          # in commands/config.rs. The first occurrence grew a unit test inside kern-cuda, which is why
          # the second one, in kern-cli, went unseen: a per-crate check has to be extended by hand, and
          # the second occurrence is the proof that it is not. This one reads the whole tree.
          python3 scripts/flat-continuation.py
          # Every entry under a code section declares what it did about its own injection. A warning,
          # never a refusal: it cannot verify an executed injection (several suites here need hardware
          # CI does not have), so demanding one would leave it checking that a FILE EXISTS - state
          # instead of content, which is the defect class the mechanism exists to catch. It asks for a
          # line and reports how many say `none`.
          python3 scripts/injection-declared.py
          # Diff-gate the seccomp allowlist: the allow set is DERIVED from the pinned moby profile, a
          # source we do not control, so a profile bump could pull a new syscall into it silently. This
          # fails if seccomp/allow-names.txt drifts from `moby_allow ∖ kern_denied`, naming the syscall
          # that would enter. Name level needs no compiler; the x86_64 number level runs when gcc is
          # present (aarch64 is skipped here for lack of the cross-toolchain).
          python3 scripts/gen-seccomp-allowlist.py --check
          # And now the gates check THEMSELVES. Every check above is a claim about what cannot get
          # in, and a green gate looks identical whether it is checking or asleep: registry-classified
          # matched two of the three ways this codebase builds a runtime-root path and missed the
          # third for as long as it existed, and no-ai-slop enforced the em-dash rule on .md alone
          # while the rule says "anywhere", so a commit could put one in a .rs, an .svg or in THIS
          # file and stay green. Both were found by writing the violation by hand and watching
          # nothing happen. So: one violation per arm, introduced into the real production file CI
          # reads, each gate required to go red, every file restored. It refuses to run if it cannot
          # put the tree back exactly as it found it, and a case it can no longer apply is a failure
          # rather than a skip.
          python3 scripts/gates-selftest.py
      - name: gpu claim suite
        # The ONE pentest suite that can run here, and it runs for a reason rather than for a green
        # tick. The other four start boxes and the runner's AppArmor denies the userns `setgroups`
        # they need, so they live behind `pentest/run-all.sh` and a freshness stamp. This one needs
        # no box.
        #
        # It covers MORE here than expected. The runner has one virtual DRM card in `/sys/class/drm`
        # and no `/dev/dri` node this user can open, so section A runs in full against a real card:
        # 10 PASS on the first CI run, including A8, which asserts against strace that the GPU scan
        # opens nothing under `/sys/class/drm` or `/proc/driver` for writing. That property was read
        # on one x86 desktop before this step existed; now a second machine of a different shape
        # checks it on every push. A3, the positive control that keeps the whole claim gate from
        # going quietly vacuous, runs here too.
        #
        # Battery B skips itself for want of an openable device node, which is a host that cannot
        # answer rather than a host that declined to, and the suite exits 0. It exits 3 only when
        # entry points exist and none of them answers, which is the case where a green would be a
        # lie. That distinction cost this step a red run before it was drawn correctly.
        run: sh pentest/pentest-gpu-claims.sh ./target/debug/kern

  workflow-lint:
    name: workflow syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The workflows are the one thing here with no local check at all: `yaml.safe_load` parses
      # `runs-on: ubunutu-latest` and a `${{ matrix.pyhton }}` typo without complaint, so a broken
      # job is found by pushing it, which is the worst moment. actionlint knows the runner labels
      # and type-checks the expression contexts; both were confirmed to fail on exactly those two
      # mistakes before this step was added.
      - uses: rhysd/actionlint@main
        with:
          args: -color

  bindings:
    name: python binding (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 is the floor `pyproject.toml` declares, and until this job existed the claim was static
          # analysis only. Installed WITHOUT the extra, because the binding's own promise is that it
          # needs nothing: the LangChain tests skip themselves and say so.
          - python: "3.9"
            extras: ""
          - python: "3.12"
            extras: "[langchain]"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest build
          python -m pip install "./bindings/python${{ matrix.extras }}"
      - name: test
        working-directory: bindings/python
        # `-rs` prints every skip WITH its reason. This runner cannot open a user namespace (AppArmor's
        # userns restriction, the same reason `pentest/` is not in CI), so the box-backed tests skip
        # here and the unit tests are what this job actually proves: rendering, output sanitising, the
        # output cap, argv and mount guards. Integration coverage stays a local claim, and the skip
        # list in the log is what says so out loud instead of a green tick implying otherwise.
        run: python -m pytest tests/ -q -rs
      - name: the binding depends on nothing
        # Checked on the ARTEFACT, not on the environment: a fresh venv always contains pip, so
        # "nothing else is installed" is not a statement anything can satisfy. Every Requires-Dist the
        # wheel declares must be behind an extra; one without a marker is a dependency by accident.
        run: |
          python -m build --wheel --outdir /tmp/whl ./bindings/python
          python - <<'PY'
          import glob, zipfile
          meta = ""
          with zipfile.ZipFile(glob.glob("/tmp/whl/*.whl")[0]) as z:
              meta = z.read([n for n in z.namelist() if n.endswith("METADATA")][0]).decode()
          reqs = [l for l in meta.splitlines() if l.startswith("Requires-Dist:")]
          unconditional = [r for r in reqs if "extra ==" not in r]
          assert not unconditional, f"the binding grew a hard dependency: {unconditional}"
          assert "Requires-Python: >=3.9" in meta, "the declared floor moved without anyone saying so"
          print(f"{len(reqs)} declared, all optional")
          PY

  test-arm:
    name: build + test (aarch64)
    # Native aarch64 hosted runner (free for public repos), not QEMU: the isolation code is
    # architecture-neutral and validated by hand on Pi / Jetson / UNO Q, so CI now proves it
    # compiles clippy-clean and its non-privileged tests pass on real aarch64 too, every push.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy --all-targets --all-features
      - name: test
        run: cargo test --all
        # The HW/privilege-gated tests skip gracefully here exactly as on x86 (the runner's
        # userns/AppArmor posture, not the arch), so aarch64 CI stays green.

  webstack:
    name: a real stack, started
    # Until this job existed CI had never STARTED a box. Every box-backed test skipped itself here,
    # because a GitHub runner ships AppArmor's unprivileged-userns restriction on and kern refuses to
    # pretend it can build a sandbox without one. That was read as "CI cannot run boxes"; it is really
    # "CI had not turned the knob". A Mac running colima hit the same wall this week, and `kern doctor`
    # named the same one-line fix there, which is what suggested trying it here.
    #
    # So this brings up the two-service stack from examples/, waits on the health gate the way a user
    # does, reads the published port, and tears it down. It exercises in one pass what no unit test
    # can: the pod network, the health dependency, the port publisher and compose's own teardown.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: what this runner allows, before and after
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # The two helpers `kern doctor` asks for by name: uidmap, so an official image that chowns
          # to its service uid (redis does) can start rootless, and passt for the pod's network.
          sudo apt-get update -qq
          sudo apt-get install -y -qq uidmap passt
      - name: the Darwin branch stays on Darwin
        # The macOS job proves the guard FIRES on a Mac. Nothing proved it does not fire anywhere
        # else, and a guard that greets every host is worse than none: it would turn every Linux
        # install into a lecture about colima. A faked `uname` reporting Linux on an arch kern does
        # not publish stops the script at the ARCH check, which is one step PAST the branch under
        # test, so reaching that error is itself the evidence the Darwin arm was not taken.
        run: |
          mkdir -p /tmp/fakeuname
          # $1 is the FAKE uname's own argument and must reach the file unexpanded, which is what the
          # single quotes are for. shellcheck cannot see that this string is a program.
          # shellcheck disable=SC2016
          printf '#!/bin/sh\ncase "$1" in -s) echo Linux;; -m) echo riscv64;; esac\n' > /tmp/fakeuname/uname
          chmod +x /tmp/fakeuname/uname
          out="$(PATH=/tmp/fakeuname:$PATH sh install.sh 2>&1)" && {
            echo "the installer exited 0 on an unsupported arch" >&2; exit 1
          }
          echo "$out"
          case "$out" in
            *Darwin*) echo "the Darwin branch fired on a Linux host" >&2; exit 1 ;;
            *"unsupported architecture"*) ;;
            *) echo "expected the arch check, got: $out" >&2; exit 1 ;;
          esac

      - name: build
        run: cargo build --bin kern
      - name: doctor says whether boxes will run here
        continue-on-error: true
        run: ./target/debug/kern doctor
      - name: bring the stack up, and prove the health gate actually gated
        # The published page says "the cache was healthy first", and that string is printed by the web
        # service unconditionally: asserting on it proves a page was served, not that anything waited.
        # compose's own output is the observable that cannot be faked by the example, so require the
        # line where it says it is holding the second service for the first one's health probe.
        run: |
          # The gate stays BARE: piping into `tee` would hand the step tee's exit status and a failed
          # `compose up` would read as a pass. Capture first, show second, assert third.
          ./target/debug/kern compose examples/compose-webstack.toml up > /tmp/up.log 2>&1 || {
            cat /tmp/up.log >&2; exit 1
          }
          cat /tmp/up.log
          grep -q "waiting for" /tmp/up.log || {
            echo "compose started the stack without ever waiting on the health gate" >&2
            cat /tmp/up.log >&2
            exit 1
          }
      - name: the published port answers, and says the cache was healthy first
        run: |
          for _ in $(seq 30); do
            body=$(curl -fsS --max-time 3 http://127.0.0.1:8088 || true)
            [ -n "$body" ] && break
            sleep 1
          done
          echo "$body"
          case "$body" in
            *"the cache was healthy first"*) ;;
            *) echo "the stack did not serve its page: $body" >&2; exit 1 ;;
          esac
      - name: the cache is a real redis, reached through the pod
        run: |
          name=$(./target/debug/kern ps -q | head -1)
          ./target/debug/kern ps
          test -n "$name" || { echo "no box is running" >&2; exit 1; }
      - name: a pod resolves its peers by name, and only for its members
        # The stack above uses a pod compose created for it; this drives the pod surface directly and
        # checks the claim that makes a pod worth having. The control is the half that matters: a box
        # OUTSIDE the pod must not resolve the peer at all, otherwise "reach each other by name" would
        # just be describing the host's network.
        run: |
          K=./target/release/kern
          test -x "$K" || K=./target/debug/kern
          $K pod create ptest
          $K box psrv --pod ptest -d --image alpine -- \
            sh -c 'while true; do printf "HTTP/1.1 200 OK\r\nConnection: close\r\n\r\nHELLO-FROM-PEER\n" | nc -lp 8080; done'
          for _ in $(seq 20); do
            got=$($K box pcli --pod ptest --image alpine -- wget -T2 -qO- http://psrv:8080 2>/dev/null || true)
            [ -n "$got" ] && break
            sleep 1
          done
          echo "inside the pod: $got"
          case "$got" in
            *HELLO-FROM-PEER*) ;;
            *) echo "a pod member could not reach its peer by name" >&2; exit 1 ;;
          esac
          out=$($K box pout --image alpine -- wget -T2 -qO- http://psrv:8080 2>&1 || true)
          echo "outside the pod: $out"
          case "$out" in
            *HELLO-FROM-PEER*) echo "a NON-member resolved the peer: the pod is not a boundary" >&2; exit 1 ;;
            *) ;;
          esac
          $K stop psrv || true
          $K pod ls

      - name: tear it down, and prove nothing is left
        if: always()
        run: |
          ./target/debug/kern compose examples/compose-webstack.toml down
          left=$(./target/debug/kern ps -q | wc -l)
          test "$left" -eq 0 || { ./target/debug/kern ps; echo "$left box(es) survived down" >&2; exit 1; }

  pentest:
    name: adversarial suites (the evidence behind SECURITY.md)
    # These four suites were kept out of CI on the ground that a GitHub runner's AppArmor denies the
    # unprivileged-userns setgroups they need, and a weekly freshness check stood in for them by
    # asserting a human had run them locally. The premise was wrong: the restriction is a sysctl, and
    # a runner has sudo. A stamp says a promise was kept; this says the boundary held, on this commit.
    #
    # 74 assertions across the four, plus the GPU claim suite that already ran here. Measured at 36
    # seconds end to end on a desktop, so the cost of running the real evidence every push is small.
    runs-on: ubuntu-latest
    # MANUAL until the fixture is understood. Boxes do run on this runner (the stack job above proves
    # it), but the suites' own registry fixture refuses to start ITS probe box here and discards the
    # reason, so all four fail in a second and blame nothing. A job that fails for a reason nobody can
    # read is worse than no job, and worse still on the push path where it would sit red.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: let this runner open an unprivileged user namespace
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update -qq
          sudo apt-get install -y -qq uidmap passt
      - name: build the binary the suites attack
        run: cargo build --release --bin kern
      - name: does a plain box run here at all
        # The discriminant the fixture swallows: same shape as its probe, with the error visible.
        run: |
          ./target/release/kern doctor || true
          ./target/release/kern box ciprobe --image alpine -- /bin/true
          echo "a plain OCI box runs on this runner"
      - name: run every suite
        # run-all.sh exits non-zero if ANY suite fails, so this step is the gate. Its own registry
        # fixture serves the images over loopback, so nothing here needs a registry account or the
        # network, and a suite failure cannot be a pull that flaked.
        run: sh pentest/run-all.sh ./target/release/kern

  caps-shape:
    name: the cap fix, in the shape it fixes
    # The bug this release closes lived on hosts with a delegated `memory` controller and NO systemd
    # user manager: a container, WSL2, a colima VM on a Mac. This runner has systemd, so every other
    # job here exercises the shape where the bug never appeared. Without this one the regression test
    # for the release's headline fix would live only in a human's terminal.
    #
    # A privileged container reproduces the shape exactly: same `kern doctor` warning, same absent
    # user manager. Both directions are asserted, because only the pair is evidence: where delegation
    # is possible the cap must BITE, and where it is not, `doctor` and the box must AGREE that it does
    # not. The second half is the one that would have caught the original defect.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build the binary under test
        run: cargo build --release --bin kern
      - name: with the controller delegated, the cap must bite
        run: |
          cat > /tmp/yes.sh <<'S'
          export PATH=/fix:$PATH
          apt-get update -qq >/dev/null 2>&1
          apt-get install -y -qq curl ca-certificates uidmap >/dev/null 2>&1
          /fix/kern pull alpine >/dev/null 2>&1
          mkdir -p /sys/fs/cgroup/leaf
          for p in $(cat /sys/fs/cgroup/cgroup.procs); do echo $p > /sys/fs/cgroup/leaf/cgroup.procs 2>/dev/null || true; done
          echo "+memory +pids" > /sys/fs/cgroup/cgroup.subtree_control
          # The positive control FIRST: if this grep finds nothing here, every other number this job
          # prints is meaningless, including the 0 the next step reads as a verdict.
          n=$(/fix/kern doctor 2>&1 | grep -ci "caps enforced")
          echo "doctor enforced=$n"
          [ "$n" = "1" ] || { echo "the assertion is broken, not the host" >&2; exit 1; }
          m=$(/fix/kern box a --image alpine --memory 64m -- sh -c 'cat /sys/fs/cgroup/memory.max' 2>&1 | grep -E '^[0-9]+$|^max$' | tail -1)
          echo "memory.max=$m"
          [ "$m" = "67108864" ] || { echo "the cap was not written" >&2; exit 1; }
          out=$(/fix/kern box b --image alpine --memory 64m -- sh -c 'dd if=/dev/zero of=/dev/shm/x bs=1M count=400 2>/dev/null; echo SURVIVED' 2>&1 | tail -1)
          echo "400 MiB under 64m: $out"
          case "$out" in *SURVIVED*) echo "the cap did not bite" >&2; exit 1 ;; esac
          S
          docker run --rm --privileged --tmpfs /run \
            -v "$PWD/target/release/kern:/fix/kern:ro" -v /tmp/yes.sh:/t.sh ubuntu:24.04 sh /t.sh
      - name: where it cannot be delegated, doctor and the box must agree
        run: |
          cat > /tmp/no.sh <<'S'
          export PATH=/fix:$PATH
          apt-get update -qq >/dev/null 2>&1
          apt-get install -y -qq curl ca-certificates uidmap >/dev/null 2>&1
          /fix/kern pull alpine >/dev/null 2>&1
          n=$(/fix/kern doctor 2>&1 | grep -ci "caps enforced")
          m=$(/fix/kern box n --image alpine --memory 32m -- sh -c 'cat /sys/fs/cgroup/memory.max' 2>&1 | grep -E '^[0-9]+$|^max$' | tail -1)
          echo "doctor enforced=$n  box memory.max=$m"
          [ "$n" = "0" ] && [ "$m" = "max" ] && exit 0
          echo "doctor and the box disagree: this is the defect the release fixes, returning" >&2
          exit 1
          S
          docker run --rm --privileged --tmpfs /run \
            -v "$PWD/target/release/kern:/fix/kern:ro" -v /tmp/no.sh:/t.sh ubuntu:24.04 sh /t.sh
      - name: doctor must not suggest a write this user cannot make
        # An unprivileged uid in a container has colima's exact cgroup shape: the cgroup is root-owned
        # and read-only, so `echo +memory > cgroup.subtree_control` is refused - and the shipped hint
        # said to run it anyway. A macOS tester ran it, saw nothing, and reported kern broken. The
        # assertion is on the ABSENCE of that sentence, so it needs the two controls below: the shape
        # must be the one under test, and the row that carries the hint must have fired at all.
        run: |
          cat > /tmp/ro.sh <<'S'
          if [ -w /sys/fs/cgroup ]; then echo "not the shape under test: the cgroup IS writable" >&2; exit 1; fi
          out=$(/fix/kern doctor 2>&1)
          echo "$out" | grep -q "NOT delegated to a child cgroup" || { echo "the hint's row never fired: nothing to assert about" >&2; echo "$out"; exit 1; }
          echo "$out" | grep -q "not writable by you" || { echo "the permission is not named" >&2; echo "$out"; exit 1; }
          if echo "$out" | grep -q "add .memory. to this tree"; then
            echo "doctor still prescribes a write that is refused here" >&2; exit 1
          fi
          S
          docker run --rm --user 1000:1000 --tmpfs /run \
            -v "$PWD/target/release/kern:/fix/kern:ro" -v /tmp/ro.sh:/t.sh ubuntu:24.04 sh /t.sh

  macos-guards:
    name: macOS guards
    # A macOS runner cannot RUN kern, and that is not the point. kern needs a Linux kernel, and a
    # hosted macOS runner has no nested virtualization, so colima or Lima cannot start a VM to hold
    # one. What this runner can check is everything kern SAYS to a Mac user, which is the part that
    # had never been executed on Darwin at all: the installer's refusal, and each SDK's error when
    # no binary is on PATH. Those are the three doors a Mac user meets, and they were verified only
    # by faking `uname` on a Linux box until this job existed.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: the installer refuses Darwin, and names the route for BOTH shapes of Mac
        # TWO BRANCHES, AND THIS USED TO TEST NEITHER OF THEM ON PURPOSE. The installer looks for
        # `colima limactl orb docker` and says something different when it finds one: a Mac that
        # already runs a Linux VM must be told to USE it, not to install a second one. Which branch a
        # bare run takes therefore depends on what the runner image happens to ship, so the old bare
        # run could not assert which message it had seen. Its one content check, `grep -q colima`,
        # passed in BOTH branches - `brew install colima` in one, `colima ssh` in the other - so it
        # would have stayed green with the branches swapped. Both are driven from a controlled PATH
        # now, and the assertion that separates them is the ABSENCE of `brew install` on the Mac that
        # already has a VM, which is the entire point of that branch.
        run: |
          set -u
          echo "what this runner image happens to ship (reported, not relied on):"
          for vm in colima limactl orb docker; do
            printf '  %-8s %s\n' "$vm" "$(command -v "$vm" 2>/dev/null || echo absent)"
          done

          # THE "no VM" PATH IS BUILT, NOT ASSUMED. `PATH=/usr/bin:/bin` looks like it excludes a VM
          # tool and does not: `docker` sits in `/usr/bin` on plenty of systems, and a runner image is
          # free to put one there too. Whether this branch is reachable would then depend on the image
          # of the day, which is not a test. On the Darwin path the installer needs `sh`, `uname` and
          # shell builtins and nothing else, so two symlinks are the whole environment.
          mkdir -p "$RUNNER_TEMP/novm" "$RUNNER_TEMP/hasvm"
          ln -sf "$(command -v sh)" "$RUNNER_TEMP/novm/sh"
          ln -sf "$(command -v uname)" "$RUNNER_TEMP/novm/uname"
          for vm in colima limactl orb docker; do
            if [ -e "$RUNNER_TEMP/novm/$vm" ]; then
              echo "the no-VM environment is not empty: it holds $vm" >&2
              exit 1
            fi
          done

          # A Mac with a VM. A file named `colima` on PATH is enough: the installer tests PRESENCE,
          # deliberately, because `docker info` on a stopped Docker Desktop takes seconds on a path
          # that has already failed the user once.
          printf '#!/bin/sh\nexit 0\n' > "$RUNNER_TEMP/hasvm/colima"
          chmod +x "$RUNNER_TEMP/hasvm/colima"

          if novm="$(PATH=$RUNNER_TEMP/novm sh install.sh 2>&1)"; then
            printf 'the installer exited 0 on macOS; it must refuse:\n%s\n' "$novm" >&2
            exit 1
          fi
          if hasvm="$(PATH=$RUNNER_TEMP/hasvm:$RUNNER_TEMP/novm sh install.sh 2>&1)"; then
            printf 'the installer exited 0 on macOS; it must refuse:\n%s\n' "$hasvm" >&2
            exit 1
          fi
          printf '===== no VM on PATH =====\n%s\n\n===== a VM on PATH =====\n%s\n' "$novm" "$hasvm"

          for out in "$novm" "$hasvm"; do
            printf '%s' "$out" | grep -q 'Linux-only (detected Darwin)' || {
              echo 'the refusal stopped naming Darwin' >&2; exit 1; }
          done

          printf '%s' "$novm" | grep -q 'No Linux VM was found on this Mac' || {
            echo 'a Mac with no VM is no longer told it has none' >&2; exit 1; }
          printf '%s' "$novm" | grep -q 'brew install colima' || {
            echo 'a Mac with no VM is no longer told how to get one' >&2; exit 1; }

          printf '%s' "$hasvm" | grep -q 'This Mac has a Linux VM installed (colima)' || {
            echo 'a Mac that already has a VM is no longer told so, by name' >&2; exit 1; }
          # `if`, not `grep ... && { exit 1; }`: a run step is `bash -e`, and in an AND-OR list only
          # the LAST command is exempt from -e. A grep that finds nothing is the GOOD case here, and
          # written as an `&&` it is also the list's exit status, so the step would have failed
          # exactly when the product was correct.
          if printf '%s' "$hasvm" | grep -q 'brew install'; then
            echo 'a Mac that already has a VM is being told to install a second one' >&2
            exit 1
          fi

          # THE CONTROL: the two runs must differ. If they do not, the PATH did not steer anything
          # and every assertion above was reading the same output twice.
          [ "$novm" != "$hasvm" ] || {
            echo 'both runs produced the same text: the branch was never taken' >&2; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the Python SDK names the VM, not a download that does not exist
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./bindings/python
          python - <<'PY'
          import kern_sandbox as k

          try:
              found = k._find_kern()
          except k.SandboxError as e:
              msg = str(e)
          else:
              raise SystemExit(f"a kern turned up on a macOS runner: {found}")
          print(msg)
          for want in ("macOS", "Linux VM", "KERN_BIN"):
              assert want in msg, f"the macOS message lost {want!r}: {msg}"
          PY
      - name: the MCP server survives a Mac with no kern, and says why
        # The likeliest way a Mac meets kern is not the CLI: it is `kern-mcp` in Claude Desktop or
        # Cursor, both of which run on Macs. The sandbox is built lazily, so the server initializes
        # and lists its tool with no kern present and only the first call fails. That call's text is
        # what the MODEL reads and relays to the user, so it has to carry the way out rather than a
        # bare "not found", and the process has to stay alive rather than take the client down.
        run: |
          python - <<'PY'
          import json, os, subprocess, sys

          env = dict(os.environ)
          env["PATH"] = "/nonexistent"
          env.pop("KERN_BIN", None)
          msgs = [
              {"jsonrpc": "2.0", "id": 1, "method": "initialize",
               "params": {"protocolVersion": "2024-11-05", "capabilities": {},
                          "clientInfo": {"name": "ci", "version": "0"}}},
              {"jsonrpc": "2.0", "id": 2, "method": "tools/list", "params": {}},
              {"jsonrpc": "2.0", "id": 3, "method": "tools/call",
               "params": {"name": "run_code", "arguments": {"code": "print(1)"}}},
          ]
          p = subprocess.run(
              [sys.executable, "-m", "kern_sandbox.mcp"],
              input="\n".join(json.dumps(m) for m in msgs) + "\n",
              capture_output=True, text=True, env=env, timeout=120,
          )
          print(p.stdout)
          assert p.returncode == 0, f"the server died on a Mac: rc={p.returncode} {p.stderr[:400]}"
          out = {}
          for line in p.stdout.splitlines():
              try:
                  o = json.loads(line)
              except ValueError:
                  raise SystemExit(f"non-JSON on the MCP channel: {line[:200]}")
              out[o.get("id")] = o
          assert "result" in out.get(1, {}), "initialize did not answer"
          assert "result" in out.get(2, {}), "tools/list did not answer"
          call = out.get(3, {}).get("result", {})
          assert call.get("isError") is True, f"the failing call was not reported as an error: {call}"
          text = json.dumps(call)
          for want in ("macOS", "Linux VM"):
              assert want in text, f"the tool error lost {want!r}, so the model cannot relay the fix"
          PY

      - name: the Node SDK says the same thing
        run: |
          node -e '
            const { Sandbox } = require("./bindings/node/index.js");
            let msg = null;
            try { new Sandbox(); } catch (e) { msg = e.message; }
            if (msg === null) throw new Error("a kern turned up on a macOS runner");
            console.log(msg);
            for (const want of ["macOS", "Linux VM", "KERN_BIN"])
              if (!msg.includes(want)) throw new Error("the macOS message lost " + want + ": " + msg);
          '

  audit:
    name: cargo-audit + cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Install recent prebuilt binaries so tool versions match local dev: the
      # pinned cargo-deny-action@v1 shipped an old cargo-deny that rejected newer
      # deny.toml keys / SPDX ids (e.g. Unicode-3.0).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      - name: cargo-deny
        run: cargo deny check
      - name: cargo-audit
        run: cargo audit
