name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: build + test (x86)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets --all-features
      - name: test
        run: cargo test --all
        # HW/privilege-gated tests skip gracefully, so x86 CI stays green.
      - name: docs
        # The two prose gates. They existed before this step and ran only when someone remembered
        # them, which is the same as not running: the three figures that drifted over the launch
        # weekend (3.6 vs 3.4 ms, five vs nine ENOSYS syscalls, ~186 vs 154-160 MB) were all caught
        # by hand or, in one case, by an outside reviewer repeating our own wrong number back to us.
        # Pure stdlib Python, both under a second, both at zero on the corpus when this was added.
        run: |
          python3 scripts/no-ai-slop.py
          python3 scripts/stale-numbers.py
          python3 scripts/test-count.py

  audit:
    name: cargo-audit + cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Install recent prebuilt binaries so tool versions match local dev: the
      # pinned cargo-deny-action@v1 shipped an old cargo-deny that rejected newer
      # deny.toml keys / SPDX ids (e.g. Unicode-3.0).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      - name: cargo-deny
        run: cargo deny check
      - name: cargo-audit
        run: cargo audit
