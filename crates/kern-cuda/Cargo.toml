[package]
name = "kern-cuda"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Cooperative VRAM quota accounting for kern. Not a security boundary: see SECURITY.md."

# `rlib` ONLY, for now, and the absence of `cdylib` is the deliberate part.
#
# The interception layer this crate will eventually carry has to be a shared object, because it works
# by being loaded into the WORKLOAD's address space and standing in front of the vendor library.
# Nothing in this crate does that yet. Shipping a `cdylib` before there is anything to load would put
# a second artifact in the release, change `install.sh` and the checksum story, and hand a reader an
# object with no symbols worth calling.
#
# So the accounting engine lands first, as a plain library, testable and benchmarkable on its own. The
# `cdylib` and the hooks arrive when they arrive, and the release keeps shipping one file until they do.
[lib]
# `cdylib` AND `rlib`. The shared object is what gets loaded into the workload's address space in
# front of the vendor library; the `rlib` is what the test binaries link so every property can be
# checked without loading anything into anything.
#
# THE BINARY IS STILL ONE FILE. `kern-cli` does not depend on this crate and nothing links it into
# the CLI: `cargo build --bin kern` does not build this, and the shipped `kern` has zero symbols from
# it. The shared object is a SEPARATE artifact that only exists on a host that wants GPU accounting,
# and a host without it behaves exactly as it does today.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The single boundary to the kernel, and the only dependency in the whole workspace. `mmap`,
# `shm_open`, `ftruncate`: three calls, in one module, behind the crate's one `unsafe` exception.
libc = "0.2"
