[package]
name = "getkern"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "kern: a fast, rootless sandbox & virtual resource runtime."
readme = "../../README.md"
keywords = ["container", "sandbox", "oci", "runtime", "namespace"]
categories = ["command-line-utilities", "virtualization"]

[[bin]]
name = "kern"
path = "src/main.rs"

[dependencies]
kern-common = { path = "../kern-common" }
kern-compose = { path = "../kern-compose" }
kern-oci = { path = "../kern-oci" }
kern-isolation = { path = "../kern-isolation" }
# Already in the tree via kern-isolation; used here for detach (fork/setsid) + liveness (kill).
libc = "0.2"
